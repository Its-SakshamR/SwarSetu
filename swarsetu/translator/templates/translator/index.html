<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 98.6vh;
        }
        .half {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .top-half {
            background-color: #f4f4f9;
            border-bottom: 2px solid #ccc;
        }
        .bottom-half {
            background-color: #ffffff;
            border-bottom: 2px solid #ccc;
            overflow-y: auto;
        }
        textarea {
            flex: 1;
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            font-size: 16px;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-group label {
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        #download-pdf-btn {
            background-color: #28a745;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        #download-pdf-btn:hover {
            background-color: #218838;
        }
        #download-txt-btn {
            background-color: #28a745;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        #download-txt-btn:hover {
            background-color: #218838;
        }
        .output-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px; 
        }
        .output {
            white-space: pre-wrap; 
            font-size: 18px;
            line-height: 1.6;
        }
        .spinner {
            border: 4px solid #f3f3f3; /* Light grey background */
            border-top: 4px solid #28a745; /* Green spinning element */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .button-disabled {
            background-color: #6c757d !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="half top-half">
        <h2>English Lyrics</h2>
        <form id="translate-form" method="POST" style="display: flex; flex-direction: column; height: 100%;">
            {% csrf_token %}
            <textarea name="lyrics" placeholder="Paste your English lyrics here...">{{ original_lyrics }}</textarea>
            
            <div class="controls">
                <div class="control-group">
                    <label for="engine">Engine:</label>
                    <select name="engine" id="engine">
                        <option value="dic" {% if source_trans == 'dic' %}selected{% endif %}>Basic</option>
                        <option value="api" {% if source_trans == 'api' %}selected{% endif %}>AI</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="orig_lang">From:</label>
                    <select name="orig_lang" id="orig_lang">
                        <option value="en" {% if orig_lang == 'en' %}selected{% endif %}>English</option>
                        <option value="hi" {% if orig_lang == 'hi' %}selected{% endif %}>Hindi</option>
                        <option value="bn" {% if orig_lang == 'bn' %}selected{% endif %}>Bengali</option>
                        <option value="ur" {% if orig_lang == 'ur' %}selected{% endif %}>Urdu</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="target_lang">To:</label>
                    <select name="target_lang" id="target_lang">
                        <option value="hi" {% if target_lang == 'hi' %}selected{% endif %}>Hindi</option>
                        <option value="bn" {% if target_lang == 'bn' %}selected{% endif %}>Bengali</option>
                        <option value="ur" {% if target_lang == 'ur' %}selected{% endif %}>Urdu</option>
                        <option value="en" {% if target_lang == 'en' %}selected{% endif %}>English</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="script">Script:</label>
                    <select name="script" id="script">
                        <option value="orig" {% if script_selected == 'orig' %}selected{% endif %}>Native</option>
                        <option value="iast" {% if script_selected == 'iast' %}selected{% endif %}>Romanized</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn">Translate</button>
                <div id="loading-spinner" class="spinner"></div>
                <span id="loading-text" style="display: none; margin-left: 10px; color: #555;">Translating... Please wait.</span>
            </div>
        </form>
    </div>

    <div class="half bottom-half">
        <div class="bottom-header">
            <h2>Translated Lyrics</h2>
            {% if translated_lyrics %}
                <button id="download-txt-btn">Download TXT</button>
                <button id="download-pdf-btn">Download PDF</button>
                <button id="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('translation-result').innerText).then(() => { alert('Translated lyrics copied to clipboard!'); });">Copy to Clipboard</button>
            {% endif %}
        </div>
        
        <div class="output-container">
            <div id="translation-result" class="output" {% if target_lang == 'ur' and script_selected == 'orig' %}dir="rtl"{% endif %}>{{ translated_lyrics|linebreaksbr }}</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        document.getElementById('translate-form').addEventListener('submit', function() {
            var btn = document.getElementById('submit-btn');
            var spinner = document.getElementById('loading-spinner');
            var text = document.getElementById('loading-text');

            btn.disabled = true;
            btn.classList.add('button-disabled');
            btn.innerText = "Processing...";

            spinner.style.display = "block";
            text.style.display = "inline";
        });

        var pdfBtn = document.getElementById('download-pdf-btn');
        if(pdfBtn){
            pdfBtn.addEventListener('click', function(){
                var orig_lyrics = document.getElementById('translation-result').innerText;
                var save_lyrics = document.createElement('div');

                if (document.getElementById('translation-result').getAttribute('dir') === 'rtl') {
                    save_lyrics.setAttribute('dir', 'rtl');
                    save_lyrics.style.textAlign = 'right';
                }
                
                var lines = orig_lyrics.split('\n');

                var safeHtml = lines.map(function(line) {
                    var content = line.trim() === '' ? '&nbsp;' : line;
                    return '<div class="pdf-line-avoid" style="min-height: 1.6em; line-height: 1.6;">' + content + '</div>';
                }).join('');
                
                save_lyrics.innerHTML = safeHtml;
                
                save_lyrics.style.padding = '20px';
                save_lyrics.style.fontSize = '16px';
                save_lyrics.style.fontFamily = 'Arial, sans-serif';

                var pdf = {
                    margin: 1,
                    filename: 'translated-lyrics.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait'},
                    pagebreak: { mode: ['css', 'legacy'], avoid: '.pdf-line-avoid' }
                };

                var original_text = this.innerText;
                this.innerText = "Generating PDF...";

                html2pdf().set(pdf).from(save_lyrics).save().then(() => {
                    this.innerText = original_text;
                });
            });
        }

        var txtBtn = document.getElementById('download-txt-btn');
        if(txtBtn){
            txtBtn.addEventListener('click', function(){
                var orig_lyrics = document.getElementById('translation-result').innerText;
                var blob = new Blob([orig_lyrics], { type: 'text/plain' });
                var link = document.createElement('a');
                var url = URL.createObjectURL(blob);
                link.href = url;
                link.download = 'translated-lyrics.txt';
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
</html>
